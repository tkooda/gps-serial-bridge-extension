<!DOCTYPE html>
<html>
<head>
  <title>GPS Serial Bridge Settings</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 600px; }
    #status { margin-top: 15px; font-weight: bold; margin-bottom: 15px; }
    .error { color: red; }
    .success { color: green; }
    .controls { margin-bottom: 10px; display: none; align-items: center; gap: 10px; }
    #serial-data-log {
      width: 100%;
      height: 250px;
      font-family: monospace;
      background-color: #f4f4f4;
      border: 1px solid #ccc;
      padding: 8px;
      overflow-y: scroll;
      display: none;
      resize: vertical;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>GPS Serial Bridge Settings</h1>
  <button id="auth-btn">Select GPS Serial Device</button>
  <div id="status"></div>

  <div id="controls-container" class="controls">
    <button id="toggle-data-btn">Show serial data</button>
    <label for="baud-rate">Baud Rate:</label>
    <select id="baud-rate">
      <option value="4800">4800</option>
      <option value="9600">9600 (Default)</option>
      <option value="19200">19200</option>
      <option value="38400">38400</option>
      <option value="57600">57600</option>
      <option value="115200">115200</option>
    </select>
  </div>

  <textarea id="serial-data-log" readonly></textarea>

  <script src="options.js"></script>
</body>
</html>
