<!DOCTYPE html>
<html>
<head>
  <title>GPS Serial Bridge Settings</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 800px; font-size: 1.1em; }
    h1 { font-size: 1.8em; }
    #status { margin: 20px 0; font-weight: bold; font-size: 1.2em; }
    .error { color: #d9534f; } .success { color: #5cb85c; }
    #parsed-data-container { display: none; margin-bottom: 20px; padding: 15px; background-color: #e8f4f8; border: 1px solid #bce8f1; border-radius: 6px; }
    #coord-header { font-weight: bold; margin-bottom: 8px; display: block; }
    #lat-lon { font-family: monospace; font-size: 1.4em; font-weight: bold; }
    #plus-code { font-family: monospace; font-size: 1.2em; font-weight: bold; color: #444; }
    .copy-btn { padding: 4px 10px; font-size: 0.8em; margin-left: 15px; vertical-align: middle; display: none; cursor: pointer; }
    .controls { margin-bottom: 20px; display: none; flex-direction: column; align-items: flex-start; gap: 15px; }
    #serial-data-log { width: 100%; height: 300px; font-family: monospace; background-color: #f4f4f4; padding: 10px; display: none; white-space: pre-wrap; font-size: 0.9em; }
    button { padding: 10px 20px; font-size: 1em; cursor: pointer; }
    select { padding: 8px; font-size: 1em; }
  </style>
</head>
<body>
  <h1>GPS Serial Bridge Settings</h1>
  
  <div class="controls" style="display: flex;">
    <label>Baud Rate: 
      <select id="baud-rate">
        <option value="4800">4800</option>
        <option value="9600">9600</option>
        <option value="14400">14400</option>
        <option value="19200">19200</option>
        <option value="38400">38400</option>
        <option value="57600">57600</option>
        <option value="115200">115200</option>
      </select>
    </label>
  </div>

  <button id="auth-btn">Connect GPS Serial Device</button>
  <div id="status"></div>
  
  <div id="parsed-data-container">
    <span id="coord-header">Live GPS coordinates:</span>
    <div style="margin-bottom: 10px;">
      <span id="lat-lon">Waiting for GPS fix...</span>
      <button id="copy-latlon-btn" class="copy-btn">Copy</button>
    </div>
    <div>
      <span id="plus-code"></span>
      <button id="copy-plus-btn" class="copy-btn">Copy</button>
    </div>
  </div>
  
  <div id="controls-container" class="controls">
    <label>Cache most recent GPS coordinate data for: 
      <select id="cache-duration">
        <option value="10000">10 seconds</option>
        <option value="60000">1 minute</option>
        <option value="300000">5 minutes</option>
        <option value="900000">15 minutes</option>
        <option value="1800000">30 minutes</option>
        <option value="3600000">1 hour</option>
        <option value="21600000">6 hours</option>
        <option value="43200000">12 hours</option>
        <option value="86400000">24 hours</option>
        <option value="604800000">1 week</option>
        <option value="-1">indefinitely</option>
      </select>
	&nbsp; (helps with GPS signal disruption)
    </label>
    <button id="toggle-data-btn">Show serial data</button>
  </div>
  <textarea id="serial-data-log" readonly></textarea>
  <script src="options.js"></script>
</body>
</html>
